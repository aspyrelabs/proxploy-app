<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Proxploy — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0F16; --panel:#121924; --panel-2:#161F2A; --elev:#1B2531;
    --line:#243040; --line-soft:#1A2330;
    --text:#E8EDF4; --text-2:#93A0B1; --text-3:#5C6979;
    --amber:#F5B544; --amber-dim:rgba(245,181,68,.13);
    --green:#3FCF8E; --green-dim:rgba(63,207,142,.13);
    --red:#F26D6D; --red-dim:rgba(242,109,109,.13);
    --blue:#5B9DF9; --blue-dim:rgba(91,157,249,.12); --violet:#A78BFA; --cyan:#34D3C6;
    --font-display:'Space Grotesk',system-ui,sans-serif;
    --font-ui:'Inter',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
    --r:14px; --r-sm:9px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--text);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(1100px 480px at 74% -8%,rgba(245,181,68,.06),transparent 60%),radial-gradient(760px 420px at 8% 4%,rgba(91,157,249,.05),transparent 55%);}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#1f2b39;border-radius:20px;border:3px solid var(--ink)}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}
  .mono{font-family:var(--font-mono)}
  .app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}

  /* sidebar */
  .side{border-right:1px solid var(--line-soft);padding:20px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:2px 6px;cursor:pointer}
  .brand .mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(150deg,#F5B544,#E0862B);box-shadow:0 6px 18px rgba(245,181,68,.28)}
  .brand .mark svg{width:18px;height:18px}
  .brand .wm{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
  .brand .wm b{color:var(--amber)}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);padding:8px 10px 4px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-sm);color:var(--text-2);font-weight:500;font-size:13.5px;position:relative;cursor:pointer}
  .nav a svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
  .nav a .cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-3)}
  .nav a:hover{background:var(--panel);color:var(--text)}
  .nav a.on{background:var(--amber-dim);color:var(--amber)}
  .nav a.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
  .side-foot{margin-top:auto;border:1px solid var(--line-soft);border-radius:var(--r);padding:12px;background:var(--panel)}
  .side-foot .row{display:flex;align-items:center;gap:9px}
  .side-foot .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-dim)}
  .side-foot .t{font-size:12.5px;font-weight:600}
  .side-foot .s{font-size:11.5px;color:var(--text-3);margin-top:2px}

  /* topbar */
  .main{display:flex;flex-direction:column;min-width:0}
  .top{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:rgba(11,15,22,.82);backdrop-filter:blur(10px);z-index:20}
  .cluster{display:flex;align-items:center;gap:10px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
  .cluster .ci{width:22px;height:22px;border-radius:6px;background:linear-gradient(150deg,#233247,#1a2432);display:grid;place-items:center}
  .cluster .ci svg{width:13px;height:13px;stroke:var(--blue);fill:none;stroke-width:1.8}
  .cluster .nm{font-family:var(--font-display);font-weight:600;font-size:13.5px}
  .cluster .pro{font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--amber);border:1px solid rgba(245,181,68,.35);border-radius:5px;padding:1px 5px;background:var(--amber-dim)}
  .cluster .pro.free{color:var(--text-3);border-color:var(--line);background:transparent}
  .cluster .chev svg{width:14px;height:14px;stroke:var(--text-3);fill:none;stroke-width:1.8}
  .search{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--line-soft);border-radius:10px;background:var(--panel);color:var(--text-3);cursor:text}
  .search input{all:unset;flex:1;color:var(--text);font-size:13px}
  .search input::placeholder{color:var(--text-3)}
  .search svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
  .search .k{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .top .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:13px;border:1px solid transparent;cursor:pointer}
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9}
  .btn.primary{background:linear-gradient(150deg,#F5B544,#E79126);color:#20160a;box-shadow:0 6px 16px rgba(245,181,68,.25)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:var(--panel);border-color:var(--line);color:var(--text-2)}
  .btn.ghost:hover{color:var(--text);border-color:#33455a}
  .btn.sm{padding:7px 12px;font-size:12.5px}
  .btn.danger{background:var(--red-dim);border-color:rgba(242,109,109,.3);color:var(--red)}
  .btn.go{background:var(--amber-dim);border-color:rgba(245,181,68,.3);color:var(--amber)}
  .btn.green{background:var(--green-dim);border-color:rgba(63,207,142,.3);color:var(--green)}
  .avatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--text-2);border:1px solid var(--line);background:linear-gradient(150deg,#26313f,#1a2330)}

  /* content shells */
  .content{padding:24px 26px 44px;display:flex;flex-direction:column;gap:22px}
  .ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .ph h1{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-.015em;margin:0}
  .ph .sub{color:var(--text-3);font-size:13px;margin-bottom:2px}
  .ph .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .live{display:flex;align-items:center;gap:7px;color:var(--text-2);font-size:12px}
  .live .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,207,142,.45)}70%{box-shadow:0 0 0 7px rgba(63,207,142,0)}100%{box-shadow:0 0 0 0 rgba(63,207,142,0)}}
  .card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px}
  .ct{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:2px}

  .grid-top{display:grid;grid-template-columns:352px 1fr;gap:18px}
  .rings{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:0 4px}
  .ring{display:flex;flex-direction:column;align-items:center;gap:9px}
  .ring .rc{position:relative;width:96px;height:96px}
  .ring svg{width:96px;height:96px;transform:rotate(-90deg)}
  .ring .rv{position:absolute;inset:0;display:grid;place-items:center}
  .ring .rv b{font-family:var(--font-mono);font-weight:600;font-size:19px}
  .ring .rl{font-size:11.5px;color:var(--text-2);font-weight:500;text-align:center}
  .ring .rl span{color:var(--text-3);font-family:var(--font-mono);font-size:10.5px;display:block;margin-top:1px}

  .nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .node{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
  .node:hover{border-color:#2c3a4b}
  .node .nh{display:flex;align-items:center;gap:9px}
  .node .nh .d{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-dim);flex:none}
  .node .nh .nn{font-family:var(--font-mono);font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .nh .role{margin-left:auto;font-size:10.5px;color:var(--text-3);border:1px solid var(--line-soft);border-radius:5px;padding:1px 6px}
  .node .meta{display:flex;gap:16px}
  .node .meta .v{font-family:var(--font-mono);font-size:15px;font-weight:600}
  .node .meta .l{font-size:11px;color:var(--text-3)}
  .bar{height:6px;border-radius:6px;background:#1d2733;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:6px}
  .brow{display:flex;flex-direction:column;gap:6px}
  .brow .bl{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2)}
  .brow .bl b{font-family:var(--font-mono);color:var(--text);font-weight:500}

  .sec-h{display:flex;align-items:center;gap:12px}
  .sec-h h2{font-family:var(--font-display);font-weight:600;font-size:16px;margin:0}
  .sec-h .badge{font-family:var(--font-mono);font-size:11px;color:var(--text-3);border:1px solid var(--line-soft);border-radius:20px;padding:2px 9px}
  .sec-h .right{margin-left:auto;display:flex;align-items:center;gap:10px}

  /* toolbar / filters */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line-soft);border-radius:9px;padding:3px}
  .seg button{border:none;background:none;color:var(--text-2);padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:500;cursor:pointer}
  .seg button.on{background:var(--elev);color:var(--text)}
  .finput{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line-soft);border-radius:9px;background:var(--panel);color:var(--text-3);min-width:200px}
  .finput svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
  .finput input{all:unset;flex:1;color:var(--text);font-size:13px}

  /* app grid */
  .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .app-c{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:15px;position:relative;display:flex;flex-direction:column;gap:13px;transition:transform .16s,border-color .16s;cursor:pointer}
  .app-c:hover{transform:translateY(-3px);border-color:#2f3e50}
  .app-c .ah{display:flex;align-items:center;gap:11px}
  .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;font-family:var(--font-display);font-weight:700;font-size:15px;color:#0d1117}
  .ico.lg{width:52px;height:52px;font-size:19px;border-radius:13px}
  .app-c .an{font-weight:600;font-size:14px;line-height:1.15}
  .app-c .ah2{display:flex;align-items:center;gap:6px;margin-top:3px}
  .host{font-family:var(--font-mono);font-size:10.5px;color:var(--text-3)}
  .st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500}
  .st .sd{width:6px;height:6px;border-radius:50%}
  .st.run{color:var(--green)}.st.run .sd{background:var(--green);box-shadow:0 0 0 2px var(--green-dim)}
  .st.stop{color:var(--text-3)}.st.stop .sd{background:var(--text-3)}
  .st.warn{color:var(--amber)}.st.warn .sd{background:var(--amber);box-shadow:0 0 0 2px var(--amber-dim)}
  .app-usage{display:flex;gap:14px}
  .app-usage .u{flex:1}
  .app-usage .ul{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);margin-bottom:4px}
  .app-usage .ul b{font-family:var(--font-mono);color:var(--text-2);font-weight:500}
  .actions{display:flex;gap:7px;border-top:1px solid var(--line-soft);padding-top:12px}
  .iconbtn{flex:1;display:grid;place-items:center;padding:7px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line-soft);color:var(--text-2);cursor:pointer}
  .iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
  .iconbtn:hover{color:var(--text);border-color:#33455a;background:var(--elev)}
  .iconbtn.wide{flex:1.6;grid-auto-flow:column;gap:6px;font-size:12px;font-weight:600}
  .iconbtn.go{background:var(--amber-dim);border-color:rgba(245,181,68,.3);color:var(--amber)}
  .iconbtn.green{background:var(--green-dim);border-color:rgba(63,207,142,.3);color:var(--green)}
  .updtag{position:absolute;top:13px;right:13px;font-family:var(--font-mono);font-size:9.5px;font-weight:600;color:var(--amber);background:var(--amber-dim);border:1px solid rgba(245,181,68,.3);border-radius:20px;padding:2px 7px}

  /* tables */
  table{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:0 10px 12px}
  .tbl td{padding:12px 10px;border-top:1px solid var(--line-soft);font-size:13px}
  .tbl tbody tr{cursor:pointer}
  .tbl tbody tr:hover td{background:var(--panel-2)}
  .vn{font-family:var(--font-mono);font-size:12.5px;display:flex;align-items:center;gap:10px}
  .vn .os{width:26px;height:26px;border-radius:7px;background:var(--panel-2);display:grid;place-items:center;border:1px solid var(--line-soft);flex:none}
  .vn .os svg{width:14px;height:14px;stroke:var(--text-2);fill:none;stroke-width:1.7}
  .spec{font-family:var(--font-mono);font-size:12px;color:var(--text-2)}
  .rowact{display:flex;gap:2px;justify-content:flex-end}
  .rowact button{background:none;border:none;color:var(--text-3);cursor:pointer;padding:6px;border-radius:6px;display:grid;place-items:center}
  .rowact button:hover{color:var(--text);background:var(--elev)}
  .rowact svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

  /* activity feed */
  .feed .fitem{display:flex;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line-soft)}
  .feed .fitem:last-child{border-bottom:none}
  .fitem .fi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;margin-top:1px}
  .fitem .fi svg{width:14px;height:14px;stroke-width:1.9;fill:none}
  .fitem .ft{font-size:12.5px;line-height:1.35}.fitem .ft b{font-family:var(--font-mono);font-weight:500}
  .fitem .fm{font-size:11px;color:var(--text-3);margin-top:2px;font-family:var(--font-mono)}
  .spark{width:100%;height:52px;margin-top:8px;display:block}
  .net .nv{display:flex;align-items:baseline;gap:8px}
  .net .nv b{font-family:var(--font-mono);font-size:20px;font-weight:600}
  .net .nv span{font-size:12px;color:var(--text-3)}

  /* store */
  .store-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .store-c{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
  .store-c:hover{border-color:#2f3e50}
  .store-c .sd2{font-size:12px;color:var(--text-2);line-height:1.4;min-height:34px}
  .store-c .sfoot{display:flex;align-items:center;gap:10px;margin-top:auto}
  .store-c .tag{font-family:var(--font-mono);font-size:10px;color:var(--text-3);border:1px solid var(--line-soft);border-radius:20px;padding:2px 8px}
  .store-c .btn{margin-left:auto}
  .cats{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line-soft);background:var(--panel);color:var(--text-2);font-size:12.5px;cursor:pointer}
  .chip.on{background:var(--amber-dim);border-color:rgba(245,181,68,.35);color:var(--amber)}

  /* detail */
  .dhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .dhead .dmeta{display:flex;flex-direction:column;gap:5px}
  .dhead h1{font-family:var(--font-display);font-size:21px;margin:0;font-weight:600}
  .dhead .dsub{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:12.5px;font-family:var(--font-mono);flex-wrap:wrap}
  .dhead .dact{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft)}
  .tabs button{border:none;background:none;color:var(--text-2);padding:11px 14px;font-size:13.5px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--text);border-bottom-color:var(--amber)}
  .tabs button:hover{color:var(--text)}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .kv .k{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
  .kv .v{font-family:var(--font-mono);font-size:14px}
  .term{background:#0a0e14;border:1px solid var(--line-soft);border-radius:10px;padding:14px 16px;font-family:var(--font-mono);font-size:12.5px;line-height:1.7;max-height:340px;overflow:auto;white-space:pre-wrap}
  .term .g{color:var(--green)}.term .a{color:var(--amber)}.term .b{color:var(--blue)}.term .r{color:var(--red)}.term .d{color:var(--text-3)}
  .code{background:#0a0e14;border:1px solid var(--line-soft);border-radius:10px;padding:16px;font-family:var(--font-mono);font-size:12.5px;line-height:1.65;overflow:auto;color:var(--text-2)}
  .code .cm{color:var(--text-3)}.code .kw{color:var(--violet)}.code .str{color:var(--green)}.code .var{color:var(--blue)}

  /* toggle */
  .toggle{width:42px;height:24px;border-radius:20px;background:#1d2733;border:1px solid var(--line);position:relative;cursor:pointer;transition:background .18s;flex:none}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#6b7889;transition:.18s}
  .toggle.on{background:var(--amber-dim);border-color:rgba(245,181,68,.4)}
  .toggle.on::after{left:20px;background:var(--amber)}
  .setrow{display:flex;align-items:center;gap:16px;padding:15px 2px;border-top:1px solid var(--line-soft)}
  .setrow:first-child{border-top:none}
  .setrow .st1{font-size:13.5px;font-weight:500}
  .setrow .st2{font-size:12px;color:var(--text-3);margin-top:2px}
  .setrow .re{margin-left:auto}

  /* lock overlay (pro) */
  .locked{position:relative}
  .locked .lockveil{position:absolute;inset:0;background:rgba(11,15,22,.72);backdrop-filter:blur(3px);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;z-index:2}
  .locked .lockveil svg{width:22px;height:22px;stroke:var(--amber);fill:none;stroke-width:1.8}
  .locked .lockveil .lt{font-weight:600;font-size:14px}
  .locked .lockveil .ls{font-size:12px;color:var(--text-2);max-width:280px}

  /* toast */
  #toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:100}
  .toast{display:flex;align-items:center;gap:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:12px 15px;min-width:250px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:tin .3s cubic-bezier(.2,.8,.3,1)}
  .toast svg{width:18px;height:18px;flex:none;stroke-width:2;fill:none}
  .toast .tt{font-size:13px}
  @keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .fade{animation:rise .45s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .two{display:grid;grid-template-columns:1fr 340px;gap:18px}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

const $ = s=>document.querySelector(s);
const circ=326.7;
function ring(pct,c1,c2,id){const off=(circ*(1-pct/100)).toFixed(1);return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" stroke="#1d2733" stroke-width="10" fill="none"/><circle cx="60" cy="60" r="52" stroke="url(#${id})" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs></svg>`;}
function sparkPath(vals,w=300,h=52){const st=w/(vals.length-1);const pts=vals.map((v,i)=>[i*st,(h-(v/100)*(h-8)-4)]);const line='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');return {line,area:line+` L${w},${h} L0,${h} Z`};}
function spark(vals,color,id){const{line,area}=sparkPath(vals);return `<svg class="spark" viewBox="0 0 300 52" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
const rnd=(n,a,b)=>Array.from({length:n},()=>a+Math.random()*(b-a));
function statusPill(s){const m={running:['run','Running'],stopped:['stop','Stopped'],update:['warn','Update']};const[c,l]=m[s]||m.running;return `<span class="st ${c}"><span class="sd"></span>${l}</span>`;}
function ico(a,lg){return `<div class="ico ${lg?'lg':''}" style="background:linear-gradient(150deg,${a.c1},${a.c2})">${a.in}</div>`;}
function toast(msg,type='info'){const t=$('#toasts');const col=type==='ok'?'var(--green)':type==='warn'?'var(--amber)':type==='err'?'var(--red)':'var(--blue)';const icn=type==='ok'?'check':type==='warn'?'update':type==='err'?'alert':'arrow';const d=document.createElement('div');d.className='toast';d.innerHTML=`<span style="color:${col}">${ic(icn)}</span><span class="tt">${msg}</span>`;t.appendChild(d);setTimeout(()=>{d.style.transition='.3s';d.style.opacity='0';d.style.transform='translateY(8px)';setTimeout(()=>d.remove(),300);},2600);}

  ['Overview',[['cluster','Cluster','cluster',''],['apps','Apps','apps',S.apps.length],['store','App Store','store2',S.store.length],['vms','Virtual Machines','vm',S.vms.length]]],
  ['Infrastructure',[['storage','Storage','storage',''],['network','Network','net',''],['backups','Backups','backup',''],['settings','Settings','settings','']]]
];
function renderNav(cur){
  $('#nav').innerHTML=NAV.map(([grp,items])=>`<div class="lbl">${grp}</div>`+items.map(([v,label,icon,cnt])=>`<a data-action="nav" data-view="${v}" class="${cur===v?'on':''}">${ic(icon)}${label}${cnt!==''?`<span class="cnt">${cnt}</span>`:''}</a>`).join('')).join('');
}

/* ---------------- VIEWS ---------------- */

    <div class="ring"><div class="rc">${ring(61,'#34D3C6','#5B9DF9','gB')}<div class="rv"><b>61%</b></div></div><div class="rl">Memory<span>78 / 128 GB</span></div></div>
    <div class="ring"><div class="rc">${ring(47,'#A78BFA','#6D5AE6','gC')}<div class="rv"><b>47%</b></div></div><div class="rl">Storage<span>4.2 / 9.0 TB</span></div></div>
  </div>`;
  const nodes=S.hosts.map(h=>`<div class="node" data-action="nav" data-view="apps">
    <div class="nh"><span class="d"></span><span class="nn">${h.name}</span><span class="role">${h.role}</span></div>
    <div class="meta"><div><div class="v">${h.vms}</div><div class="l">VMs</div></div><div><div class="v">${h.apps}</div><div class="l">Apps</div></div><div><div class="v">${h.up}</div><div class="l">Uptime</div></div></div>
    <div class="brow"><div class="bl">CPU <b>${h.cpu}%</b></div><div class="bar"><i style="width:${h.cpu}%;background:linear-gradient(90deg,#F5B544,#E0862B)"></i></div></div>
    <div class="brow"><div class="bl">RAM <b>${h.ram}%</b></div><div class="bar"><i style="width:${h.ram}%;background:linear-gradient(90deg,#34D3C6,#5B9DF9)"></i></div></div>
  </div>`).join('');

    <div class="card fade"><div class="ct">Cluster resources</div>${rings}</div>
    <div class="nodes">${nodes}</div>
  </div>
  <div class="sec-h fade"><h2>Apps</h2><span class="badge">${S.apps.filter(a=>a.status==='running').length} running · ${S.apps.filter(a=>a.status==='stopped').length} stopped</span><div class="right"><button class="btn ghost sm" data-action="nav" data-view="apps">View all</button><button class="btn ghost sm" data-action="update-all">Update all</button></div></div>
  <div class="apps">${appCards}</div>
  <div class="two">
    <div class="card fade"><div class="sec-h" style="margin-bottom:14px"><h2 style="font-size:15px">Virtual machines</h2><span class="badge">${S.vms.filter(v=>v.status==='running').length} of ${S.vms.length}</span><div class="right"><button class="btn ghost sm" data-action="nav" data-view="vms">Manage</button></div></div>${vmTable(S.vms.slice(0,4))}</div>
    <div class="card fade"><div class="ct">Network throughput</div><div class="net"><div class="nv"><b style="color:var(--blue)">↓ 142</b><span>Mbps in</span><b style="color:var(--green);margin-left:8px">↑ 38</b><span>Mbps out</span></div>${spark([38,42,30,58,48,64,52,70,58,66,50,60,54,62],'#5B9DF9','ng1')}</div><div class="ct" style="margin-top:20px">Recent activity</div><div class="feed">${feed}</div></div>

function appCard(a){
  const stopped=a.status==='stopped';
  const primary= stopped
    ? `<button class="iconbtn wide green" data-action="toggle" data-type="apps" data-id="${a.id}">${ic('play')}Start</button>`
    : `<button class="iconbtn wide go" data-action="open" data-id="${a.id}">${ic('open')}Open</button>`;
  return `<div class="app-c fade" data-action="detail" data-type="apps" data-id="${a.id}" style="${stopped?'opacity:.72':''}">
    ${a.update?`<span class="updtag">UPDATE</span>`:''}
    <div class="ah">${ico(a)}<div><div class="an">${a.name}</div><div class="ah2"><span class="host">${a.host}</span>${statusPill(a.status)}</div></div></div>
    <div class="app-usage"><div class="u"><div class="ul">CPU <b>${a.cpu}%</b></div><div class="bar"><i style="width:${Math.max(a.cpu,1)}%;background:#F5B544"></i></div></div><div class="u"><div class="ul">RAM <b>${a.ram?a.ram+'G':'—'}</b></div><div class="bar"><i style="width:${a.ramPct}%;background:#34D3C6"></i></div></div></div>
    <div class="actions" onclick="event.stopPropagation()">
      ${primary}
      <button class="iconbtn" title="Restart" data-action="restart" data-id="${a.id}">${ic('restart')}</button>
      <button class="iconbtn" title="Logs" data-action="detail" data-type="apps" data-id="${a.id}" data-tab="logs">${ic('logs')}</button>
    </div>
  </div>`;
}

function vApps(){
  const q=S.appFilter.q.toLowerCase();
  let list=S.apps.filter(a=>(S.appFilter.host==='all'||a.host===S.appFilter.host)&&a.name.toLowerCase().includes(q));
  const hostBtns=['all',...S.hosts.map(h=>h.id)].map(h=>`<button class="${S.appFilter.host===h?'on':''}" data-action="app-host" data-host="${h}">${h==='all'?'All hosts':h}</button>`).join('');
  return `
  <div class="ph fade"><h1>Apps</h1><div class="sub">${S.apps.length} installed across 3 hosts</div><div class="right"><button class="btn primary sm" data-action="nav" data-view="store">${ic('plus')}App Store</button></div></div>
  <div class="toolbar fade"><div class="seg">${hostBtns}</div><div class="finput">${ic('search')}<input id="appq" placeholder="Filter apps…" value="${S.appFilter.q}"></div><span class="badge" style="margin-left:auto">${list.length} shown</span></div>
  ${list.length?`<div class="apps">${list.map(appCard).join('')}</div>`:`<div class="empty">No apps match your filter.</div>`}`;
}

function vStore(){
  const cats=['All','Media','Home & Auto','Files','Network','Monitoring','Databases','Security','Dev','Docker','Productivity'];
  const list=S.store.filter(s=>S.storeCat==='All'||s.cat===S.storeCat);
  const installed=new Set(S.apps.map(a=>a.name));
  return `
  <div class="ph fade"><h1>App Store</h1><div class="sub">Sourced from community-scripts/ProxmoxVE · showing ${S.store.length} of 300+ scripts</div><div class="right"><span class="live"><span class="pulse"></span>Catalog synced 6m ago</span><button class="btn ghost sm" data-action="sync">${ic('restart')}Refresh</button></div></div>
  <div class="cats fade">${cats.map(c=>`<span class="chip ${S.storeCat===c?'on':''}" data-action="store-cat" data-cat="${c}">${c}</span>`).join('')}</div>
  <div class="store-grid">${list.map(s=>{
    const has=installed.has(s.n);
    return `<div class="store-c fade">
      <div class="ah" style="display:flex;align-items:center;gap:11px">${ico(s)}<div><div class="an" style="font-weight:600;font-size:14px">${s.n}</div><div class="host" style="margin-top:3px">${s.cat}</div></div></div>
      <div class="sd2">${s.d}</div>
      <div class="sfoot"><span class="tag">${s.pop}</span><span class="tag">LXC</span>${has?`<button class="btn ghost sm" disabled style="margin-left:auto;opacity:.6">${ic('check')}Installed</button>`:`<button class="btn go sm" data-action="install" data-name="${s.n}" data-in="${s.in}" data-c1="${s.c1}" data-c2="${s.c2}" data-cat="${s.cat}">${ic('plus')}Install</button>`}</div>
    </div>`;}).join('')}</div>`;
}

function vmTable(list){
  return `<table class="tbl"><thead><tr><th>Name</th><th>Node</th><th>vCPU / RAM</th><th>Status</th><th></th></tr></thead><tbody>${list.map(v=>`
    <tr data-action="detail" data-type="vms" data-id="${v.id}">
      <td><div class="vn"><span class="os">${ic(v.os)}</span>${v.name}</div></td>
      <td class="spec">${v.host}</td><td class="spec">${v.cpu} · ${v.ramGB} GB</td>
      <td>${statusPill(v.status)}</td>
      <td onclick="event.stopPropagation()"><div class="rowact">
        ${v.status==='stopped'?`<button title="Start" style="color:var(--green)" data-action="toggle" data-type="vms" data-id="${v.id}">${ic('play')}</button>`:`<button title="Console" data-action="detail" data-type="vms" data-id="${v.id}">${ic('console')}</button><button title="Restart" data-action="restart" data-id="${v.id}">${ic('restart')}</button>`}
        <button title="Logs" data-action="detail" data-type="vms" data-id="${v.id}">${ic('logs')}</button>

    </tr>`).join('')}</tbody></table>`;
}

function vStorage(){
  const cards=S.storages.map(s=>{const pct=Math.round(s.used/s.total*100);return `<div class="card fade"><div style="display:flex;align-items:center;gap:11px"><span class="os" style="width:34px;height:34px;border-radius:9px">${ic('storage')}</span><div><div style="font-weight:600">${s.n}</div><div class="host">${s.node} · ${s.type}</div></div><span class="badge" style="margin-left:auto">${pct}%</span></div>

/* detail */
function vDetail(type,id){
  const a= type==='vms'?vmById(id):appById(id);
  if(!a) return `<div class="empty">Not found. <a data-action="nav" data-view="apps" style="color:var(--amber);cursor:pointer">Back to apps</a></div>`;
  const isVM=type==='vms';
  const stopped=a.status==='stopped';
  const tabs=isVM?['overview','console','snapshots']:['overview','logs','console','config'];
  const tab=S.detailTab;
  const iconEl= isVM?`<div class="ico lg" style="background:linear-gradient(150deg,#26313f,#1a2330);color:var(--text-2)">${ic(a.os)}</div>`:ico(a,true);
  const subline= isVM
    ? `<span>VMID ${a.vmid}</span><span>·</span><span>${hostName(a.host)}</span><span>·</span><span>${a.cpu} vCPU / ${a.ramGB} GB</span>`
    : `<span>CTID ${a.ctid}</span><span>·</span><span>${hostName(a.host)}</span><span>·</span><span>${a.ip}:${a.port}</span>`;
  const act= stopped
    ? `<button class="btn green sm" data-action="toggle" data-type="${type}" data-id="${a.id}">${ic('play')}Start</button>`
    : `<button class="btn go sm" data-action="open" data-id="${a.id}">${ic('open')}Open web UI</button><button class="btn ghost sm" data-action="restart" data-id="${a.id}">${ic('restart')}Restart</button><button class="btn ghost sm" data-action="toggle" data-type="${type}" data-id="${a.id}">${ic('stop')}Stop</button>`;
  let body='';
  if(tab==='overview'){
    const cpu=isVM?(a.status==='running'?Math.round(a.cpu*8):0):a.cpu;
    const rp=isVM?Math.round(a.ramGB/64*100):a.ramPct;
    body=`<div class="three" style="margin-top:18px">
      <div class="card"><div class="ct">CPU</div><div style="font-family:var(--font-mono);font-size:22px;margin:8px 0">${cpu}%</div>${spark(stopped?rnd(14,0,1):rnd(14,cpu*0.4,cpu*1.3),'#F5B544','dc'+id)}</div>
      <div class="card"><div class="ct">Memory</div><div style="font-family:var(--font-mono);font-size:22px;margin:8px 0">${isVM?a.ramGB+' GB':(a.ram||0)+' GB'}</div><div class="bar" style="margin-top:8px"><i style="width:${rp}%;background:linear-gradient(90deg,#34D3C6,#5B9DF9)"></i></div><div class="host" style="margin-top:8px">${rp}% of allocated</div></div>
      <div class="card"><div class="ct">Status</div><div style="margin:10px 0">${statusPill(a.status)}</div><div class="host">Uptime ${stopped?'—':'6d 4h'}</div></div>
    </div>
    <div class="card" style="margin-top:16px"><div class="ct" style="margin-bottom:14px">Details</div><div class="kv">
      <div><div class="k">${isVM?'VMID':'CTID'}</div><div class="v">${isVM?a.vmid:a.ctid}</div></div>
      <div><div class="k">Node</div><div class="v">${a.host}</div></div>
      <div><div class="k">${isVM?'Disk':'IP address'}</div><div class="v">${isVM?a.disk:a.ip}</div></div>
      <div><div class="k">${isVM?'OS type':'Category'}</div><div class="v">${isVM?a.os:a.cat}</div></div>
      ${!isVM?`<div><div class="k">Web port</div><div class="v">${a.port}</div></div>`:''}
      ${a.update?`<div><div class="k">Update</div><div class="v" style="color:var(--amber)">v${a.update} available</div></div>`:''}
    </div>
    ${a.update?`<button class="btn go sm" style="margin-top:16px" data-action="do-update" data-id="${a.id}">${ic('update')}Update to v${a.update}</button>`:''}
    </div>`;
  } else if(tab==='logs'){
    body=`<div class="card" style="margin-top:18px"><div class="term"><span class="d">[2026-07-28 09:14:02]</span> <span class="g">INFO</span>  Starting ${a.name} service...
<span class="d">[2026-07-28 09:14:02]</span> <span class="g">INFO</span>  Loading configuration from /etc/${a.name.toLowerCase()}/config.yml
<span class="d">[2026-07-28 09:14:03]</span> <span class="b">DEBUG</span> Connected to database on ${a.ip||'127.0.0.1'}:5432
<span class="d">[2026-07-28 09:14:03]</span> <span class="g">INFO</span>  Listening on 0.0.0.0:${a.port||8080}
<span class="d">[2026-07-28 09:14:05]</span> <span class="g">INFO</span>  Health check passed
<span class="d">[2026-07-28 09:18:41]</span> <span class="a">WARN</span>  Cache miss ratio above 40%, warming cache
<span class="d">[2026-07-28 09:22:10]</span> <span class="g">INFO</span>  Scheduled task 'cleanup' completed in 214ms
<span class="d">[2026-07-28 09:31:55]</span> <span class="g">INFO</span>  2 clients connected
<span class="d">[2026-07-28 09:44:12]</span> <span class="b">DEBUG</span> GET /api/v1/status 200 8ms
<span class="d">[2026-07-28 09:44:12]</span> <span class="g">INFO</span>  Backup snapshot registered</div></div>`;
  } else if(tab==='console'){
    body=`<div class="card" style="margin-top:18px"><div class="term"><span class="g">root@${a.name.toLowerCase().replace(/ /g,'-')}</span>:<span class="b">~</span># uptime
 09:45:12 up 6 days,  4:11,  1 user,  load average: 0.14, 0.09, 0.06
<span class="g">root@${a.name.toLowerCase().replace(/ /g,'-')}</span>:<span class="b">~</span># systemctl status ${a.name.toLowerCase()}
● ${a.name.toLowerCase()}.service - ${a.name}
   Loaded: loaded (/etc/systemd/system/${a.name.toLowerCase()}.service; enabled)
   Active: <span class="g">active (running)</span> since Tue 2026-07-22; 6 days ago
<span class="g">root@${a.name.toLowerCase().replace(/ /g,'-')}</span>:<span class="b">~</span># <span style="border-left:2px solid var(--amber);animation:none">&nbsp;</span></div></div>`;
  } else if(tab==='config'){
    body=`<div class="card" style="margin-top:18px"><div class="sec-h" style="margin-bottom:12px"><h2 style="font-size:14px">Saved Community Script</h2><div class="right"><button class="btn ghost sm" data-action="toast" data-msg="Config saved and container reloaded" data-type="ok">${ic('check')}Save</button></div></div><div class="code"><span class="cm"># ${a.name} — proxploy managed (ct ${a.ctid})</span>
<span class="kw">source</span> <span class="str">"$FUNCTIONS_FILE_PATH"</span>

  check_container_storage
  msg_info <span class="str">"Updating ${a.name}"</span>

}

  } else if(tab==='snapshots'){

/* ---------------- ROUTER ---------------- */
const VIEWS={cluster:vCluster,apps:vApps,store:vStore,vms:vVMs,storage:vStorage,network:vNetwork,backups:vBackups,settings:vSettings};
function route(){
  const hash=location.hash.replace(/^#\/?/,'')||'cluster';
  const parts=hash.split('/');
  let navKey=parts[0];
  let html;
  if(parts[0]==='detail'){html=vDetail(parts[1],parts[2]);navKey=parts[1]==='vms'?'vms':'apps';}
  else{html=(VIEWS[parts[0]]||vCluster)();}
  $('#view').innerHTML=html;
  renderNav(navKey);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------------- ACTIONS ---------------- */
function tierPill(){const p=$('#tierPill');if(S.tier==='pro'){p.textContent='PRO · MULTI-HOST';p.classList.remove('free');}else{p.textContent='FREE · 1 HOST';p.classList.add('free');}}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!t) return;
  const act=t.dataset.action;
  if(act==='nav'){location.hash='#/'+t.dataset.view;return;}
  if(act==='detail'){S.detailTab=t.dataset.tab||'overview';location.hash='#/detail/'+t.dataset.type+'/'+t.dataset.id;return;}
  if(act==='tab'){S.detailTab=t.dataset.tab;route();return;}
  if(act==='app-host'){S.appFilter.host=t.dataset.host;route();return;}
  if(act==='store-cat'){S.storeCat=t.dataset.cat;route();return;}
  if(act==='sync'){toast('Synced with cluster · catalog up to date','ok');return;}
  if(act==='update-all'){S.apps.forEach(a=>delete a.update);toast('Updating 3 apps in the background…','warn');route();return;}
  if(act==='toast'){toast(t.dataset.msg||'Done',t.dataset.type||'info');return;}
  if(act==='toggle'){
    const item=(t.dataset.type==='vms'?vmById:appById)(t.dataset.id);
    if(item){item.status=item.status==='stopped'?'running':'stopped';if(item.status==='stopped'){item.cpu=0;if(item.ramPct!==undefined)item.ramPct=0;}else{item.cpu=item.cpu||5;if(item.ramPct!==undefined&&item.ramPct===0)item.ramPct=20;}
    toast(`${item.name} ${item.status==='running'?'started':'stopped'}`,item.status==='running'?'ok':'info');route();}
    return;
  }
  if(act==='restart'){const item=appById(t.dataset.id)||vmById(t.dataset.id);toast(`Restarting ${item?item.name:'guest'}…`,'warn');return;}
  if(act==='open'){const a=appById(t.dataset.id);toast(`Opening ${a?a.name:'app'} web UI in a new tab…`,'info');return;}
  if(act==='do-update'){const a=appById(t.dataset.id);if(a){delete a.update;toast(`${a.name} updated to latest`,'ok');route();}return;}
  if(act==='install'){
    const name=t.dataset.name;
    toast(`Deploying ${name} to host-01…`,'warn');
    setTimeout(()=>{
      const id=Date.now();
      S.apps.push({id,name,host:'host-01',status:'running',cpu:3,ram:0.6,ramPct:16,c1:t.dataset.c1,c2:t.dataset.c2,in:t.dataset.in,cat:t.dataset.cat,port:8080,ip:'10.0.20.'+(60+S.apps.length),ctid:150+S.apps.length});
      toast(`${name} installed and running`,'ok');route();
    },1100);
    return;
  }
  if(act==='tier'){S.tier=S.tier==='pro'?'free':'pro';tierPill();route();return;}
});
$('#appq')&&null;
document.addEventListener('input',e=>{if(e.target.id==='appq'){S.appFilter.q=e.target.value;const list=S.apps.filter(a=>(S.appFilter.host==='all'||a.host===S.appFilter.host)&&a.name.toLowerCase().includes(e.target.value.toLowerCase()));const wrap=$('#view');/* re-render apps grid only to keep focus */const grid=wrap.querySelector('.apps');if(grid){grid.innerHTML=list.map(appCard).join('');}const badge=wrap.querySelector('.toolbar .badge');if(badge)badge.textContent=list.length+' shown';}});

/* init */
tierPill();
if(!location.hash) location.hash='#/cluster';
route();
</script>
