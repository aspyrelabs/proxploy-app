name: ci
# Mostly manual: run the whole thing from the Actions tab, or
# `gh workflow run ci.yml`. Only `frontend`, `e2e` and `backend` also run on a
# push, and only when a push touched code they actually cover. Every other job
# carries `if: github.event_name != 'push'` and stays hand-run, which is what
# the owner asked for when the blanket push trigger came out.
#
# `backend` joined them on 2026-08-25. Its 2000-odd tests were running nowhere
# except on a developer's laptop, so a backend regression could be pushed to
# main and reported green by a run that had never executed a single backend
# test. Its license-audit STEP keeps the manual gate, because the hand-run
# licensing check is a deliberate decision and not the thing that was broken.
#
# The frontend/e2e exceptions are here because they are the jobs that rot
# silently.
# They assert on the UI as it is drawn, so a rename, a control moved into a
# menu, or an added wizard step breaks them without breaking anything a unit
# test looks at. Between 2026-08-09 and 2026-08-24 nobody dispatched this
# workflow, and in that window the e2e suite went fully dark: journey.spec.ts
# failed its first step and the `chromium` project depends on it, so the other
# 14 tests reported "did not run" rather than failing. Six separate drifts had
# piled up by the time anyone looked.
#
# The weekly schedule is still gone, so upstream and licensing drift is still
# only checked when someone runs this by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      # The e2e job boots the real backend (playwright.config.ts webServer),
      # so a server-side change can break it with no frontend file touched.
      - 'backend/proxploy/**'
      # `backend` runs on push now, so the things that decide whether it passes
      # have to be able to trigger it. A test-only or dependency-only change
      # used to start no run at all.
      - 'backend/tests/**'
      - 'backend/pyproject.toml'
      - 'backend/scripts/**'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: python -m pytest tests/ -q -m "not pve_integration and not e2e"
      - run: python scripts/check_executor_isolation.py
      - name: openapi schema exports cleanly
        run: python scripts/export_openapi.py /tmp/openapi.json
      # Still hand-run, unlike the rest of this job: upstream and licensing
      # drift is checked deliberately, not on every push (see the header).
      - name: license audit (doc 03 protocol, fails on anything outside brief §3)
        if: github.event_name != 'push'
        run: pip-licenses --partial-match --ignore-packages proxploy --allow-only "MIT;MIT License;BSD;BSD License;Apache;Apache Software License;ISC;Python Software Foundation;PSF-2.0;PostgreSQL;Public Domain;Mozilla Public License 2.0;Eclipse Public License v2.0;EPL-2.0;The Unlicense;CMU License (MIT-CMU)"

  backend-postgres:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: pp, POSTGRES_DB: proxploy}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults: {run: {working-directory: backend}}
    env:
      PROXPLOY_TEST_PG_DSN: postgresql+psycopg://postgres:pp@localhost:5432/proxploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev,postgres]'
      - run: python -m pytest tests/test_migrations.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: license audit (npm)
        run: >
          npx license-checker-rseidelsohn --production
          --excludePackages "frontend@0.0.0" --onlyAllow
          "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;MPL-2.0;0BSD;CC0-1.0;Unlicense;OFL-1.1"

  # Geometry, in a real browser. The card and dialog components have FIXED
  # heights, and jsdom has no layout engine, so the vitest suite can only
  # compare class names: a card whose text overlapped itself and a dialog
  # taller than the screen both shipped through a fully green `frontend` job.
  # This renders the real components with the real stylesheet in Chromium and
  # fails on content that does not fit, on a row whose heights disagree, and on
  # a panel over its cap. Needs no backend and no dev server; the harness
  # serves itself on an ephemeral port.
  geometry:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run harness

  pve-integration:
    # Doc 10 Phase 1 (b): disposable-PVE matrix. Wired now; runs when the repo
    # secrets point at throwaway PVE 8/9 boxes (doc 11 §7). The PVE 9 leg may be
    # added incrementally through Phase 2 per the DoD.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy: {matrix: {pve: [pve8, pve9]}}
    defaults: {run: {working-directory: backend}}
    env:
      PROXPLOY_TEST_PVE_URL: ${{ secrets[format('{0}_URL', matrix.pve)] }}
      PROXPLOY_TEST_PVE_TOKEN_ID: ${{ secrets[format('{0}_TOKEN_ID', matrix.pve)] }}
      PROXPLOY_TEST_PVE_TOKEN_SECRET: ${{ secrets[format('{0}_TOKEN_SECRET', matrix.pve)] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - name: run against disposable PVE (skips cleanly when secrets are absent)
        run: python -m pytest tests/ -q -m pve_integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      # The harness launches the backend itself (frontend/playwright.config.ts
      # webServer), so it needs a real venv at backend/.venv: the path that
      # config hardcodes: not just a pip install on the runner python.
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

  scripts:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # -x follows sourced files; -P SCRIPTDIR lets it resolve the dynamic
      # `$(dirname "$0")/../lib/common.sh` sourcing both install.sh and
      # proxploy-update use. A bare `shellcheck <path>` SC1091s on every one
      # of them: established while implementing Tasks 7 and 9.
      - run: shellcheck -x -P SCRIPTDIR install.sh packaging/proxploy-update packaging/lib/*.sh packaging/tests/*.sh packaging/build_release.sh

  install-harness:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: bash packaging/tests/channel_fixture.sh /tmp/pp-channel
      - run: bash packaging/tests/test_install.sh
      - run: bash packaging/tests/test_upgrade_rollback.sh
      - run: bash packaging/tests/test_pve_half.sh

  # Task 12 lowered requires-python to >=3.11, because Debian 12: which is
  # what a Proxmox VE 8 CT template is, and therefore the actual LXC install
  # target: ships 3.11 and pip refused to install at all. A supported-version
  # claim nothing tests is not a claim; the `backend` job above runs 3.12, so
  # this leg holds the floor honest.
  backend-py311:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e '.[dev]'
      - run: python -m pytest tests/ -q -m "not pve_integration and not e2e"
