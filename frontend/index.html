<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- The tab bar is painted by the browser chrome, which follows the
         operating system, NOT this app's theme. So these are scoped to
         prefers-color-scheme rather than swapped when someone uses the theme
         toggle: a light mark on a dark tab strip would be the bug. -->
    <!-- These two and NOTHING else. There used to be a third, unconditional
         link as a fallback for a browser that reads no media query here, and
         it is why the light mark sat in this file unused: measured in a real
         Chromium, an unconditional link is fetched alongside the scoped one
         and wins, in BOTH schemes, wherever it is placed. Reordering it did
         not help; only removing it did.

         Verified by watching what the browser actually requests, because
         headless Chromium does not fetch favicons at all and cannot answer
         this. With both scoped links alone: dark -> dark, light -> light.

         The cost is a browser that ignores `media` on an icon link, which now
         takes whichever of these two it likes rather than a guaranteed one.
         That is a worse icon on an old browser against no theming at all on
         current ones. Do not "restore the fallback". -->
    <link rel="icon" type="image/svg+xml" href="/proxploy-favicon-dark.svg"
          media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/proxploy-favicon-light.svg"
          media="(prefers-color-scheme: light)" />
    <!-- iOS ignores SVG icons, so a real PNG for the home screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B0F16" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxploy</title>
    <!-- Runs before first paint, so a light-mode machine does not get a
         frame of dark first. main.tsx calls applyStoredTheme again on module
         load; this is only the part that has to happen sooner than that. -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('pp_theme') ??
          (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch (e) { /* private mode, stay on the markup default */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
