[project]
name = "proxploy"
version = "0.1.0"
description = "Proxploy — Unraid's experience, for Proxmox"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "PyJWT>=2.9",
  "httpx>=0.27",
  "proxmoxer>=2.0",
  "requests>=2.32",
  "slowapi>=0.1.9",
  "email-validator>=2.0",
  "apprise>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pip-licenses>=5"]
# LGPL-3.0 (doc 00 §3: never linked into the shipped app) — installed only for
# the opt-in Postgres CI leg, kept out of the license-audited `dev` extra.
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proxploy*"]

[tool.pytest.ini_options]
markers = [
  "pve_integration: needs a disposable live PVE (PROXPLOY_TEST_PVE_* env)",
  "e2e: cross-repo roundtrip against a local proxploy-api",
]
