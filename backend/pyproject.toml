[project]
name = "proxploy"
dynamic = ["version"]
description = "Proxploy, Unraid's experience, for Proxmox"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "PyJWT>=2.9",
  "httpx>=0.27",
  "proxmoxer>=2.0",
  "requests>=2.32",
  "slowapi>=0.1.9",
  "email-validator>=2.0",
  "apprise>=1.9",
  "asyncssh>=2.14",
  "websockets>=14",
  "python-multipart>=0.0.9",
  "requests-toolbelt>=1.0",
  # Error reporting to GlitchTip, which speaks the Sentry ingest protocol.
  # Installed always, active only when PROXPLOY_SENTRY_DSN is set: the code
  # path is one `if` in main.py, so shipping the dep costs nothing an operator
  # who never opts in can observe.
  "sentry-sdk[fastapi]>=2.0",
  # Cron math ONLY (proxploy/jobs/scheduler.py): CronTrigger's parsing and
  # DST-correct next-fire arithmetic. Its BaseScheduler/jobstores are unused:
  # doc 04 makes the `schedules` table authoritative, so a second in-memory
  # registry would be two sources of truth. Docs say "APScheduler 4"; no 4.x
  # release exists (alphas only, verified 2026-08-01) and doc 03 marks
  # Scheduling "Provisional (seam: Scheduler)": see docs/notes/phase-7-operate.md.
  "APScheduler>=3.11,<4",
  # Phase 8 (Scale). Licenses verified against PyPI 2026-08-05 and run through
  # the ci.yml allowlist: casbin Apache-2.0 (pulls simpleeval, MIT), Authlib
  # BSD-3-Clause (pulls joserfc, BSD-3-Clause), pyotp MIT.
  "casbin>=1.43,<2",
  "Authlib>=1.7,<2",
  "pyotp>=2.10,<3",
  # Custom app icons ONLY (services/app_icons.py): decode whatever image the
  # operator uploaded and re-encode it to one 512x512 WebP, so the tile in the
  # grid is the same weight whether the source was a 40px favicon or a 12 MP
  # photo. Also the only thing here that can safely decide an upload really is
  # an image: neither the filename nor the Content-Type is evidence.
  "Pillow>=10.4",
]

[project.scripts]
# doc 04 specifies a `proxploy audit export` CLI by name. It reads the database
# directly so the audit trail can be recovered when nobody can log in, which is
# when it is most often wanted.
proxploy = "proxploy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pip-licenses>=5"]
# LGPL-3.0 (doc 00 §3: never linked into the shipped app): installed only for
# the opt-in Postgres CI leg, kept out of the license-audited `dev` extra.
postgres = ["psycopg[binary]>=3.2"]
# Heavy dev-only tooling (mutation testing, doc 11 mutation-gate follow-up),
# kept out of the license-audited `dev` extra for the same reason as
# `postgres` above: it's never installed for the shipped app, so it never
# needs to clear the runtime license allowlist. BSD-3-Clause anyway.
mutation = ["mutmut>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "proxploy.__version__"}

[tool.setuptools.packages.find]
include = ["proxploy*"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` dies during collection rather than running
# anything: mutmut writes a full copy of the tree into the gitignored
# `mutants/`, so pytest finds two files claiming to be `tests.conftest` and
# raises ImportPathMismatchError. Only `tests/` was ever meant to be collected.
testpaths = ["tests"]
markers = [
  "pve_integration: needs a disposable live PVE (PROXPLOY_TEST_PVE_* env)",
  "e2e: cross-repo roundtrip against a local proxploy-api",
]

[tool.mutmut]
# Mutation-testing gate (standing rule, doc 11): scoped to the
# security/infra-critical modules named by the rule. "RLS" doesn't exist in
# this codebase (no row-level security anywhere): api/deps.py is the actual
# authz surface (Phase-1 RBAC stub) and stands in for it here; see
# backend/README.md for why.
source_paths = ["proxploy"]
# tests/test_isolation_lint.py subprocess-invokes this script by relative
# path; without it the stats-collection pass errors on a file that has
# nothing to do with mutation testing.
also_copy = ["scripts/"]
only_mutate = [
  "proxploy/secretstore/__init__.py",
]
# Run the same non-integration selection CI already uses. mutmut only runs
# this once to build a function->tests map (mutation testing itself only
# reruns the handful of tests that actually cover the mutated function), so
# there's no benefit to hand-picking a narrower set and a real risk of
# under-covering a target module by guessing wrong.
pytest_add_cli_args_test_selection = ["tests/", "-m", "not pve_integration and not e2e"]
